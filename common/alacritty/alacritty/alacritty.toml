[selection]
save_to_clipboard = true


[keyboard]
bindings = [

{ key = "C", mods = "Control|Shift", action = "Copy"},
{ key = "V", mods = "Control|Shift", action = "Paste"}

]

[colors.bright]
black = "#1c252c"
blue = "#8cc1ff"
cyan = "#90daff"
green = "#94f7c5"
magenta = "#e2a6ff"
red = "#fc7b81"
white = "#fafdff"
yellow = "#ffeba6"

[colors.cursor]
cursor = "#f5f5f5"
text = "CellForeground"

[colors.normal]
black = "#101419"
blue = "#70a5eb"
cyan = "#74bee9"
green = "#78dba9"
magenta = "#c68aee"
red = "#e05f65"
white = "#dee1e6"
yellow = "#f1cf8a"

[colors.primary]
background = "#040405"
foreground = "#b6beca"

[window.padding]
x = 20
y = 20



[font]
  normal = { family = "Fairfax Hax", style = "Medium" }
  bold = { family = "Fairfax Hax", style = "Bold" }
  italic = { family = "Fairfax Hax", style = "Italic" }
  bold_italic = { family = "Fairfax Hax", style = "Bold" }
  size = 9

[terminal]
shell = { program = "/usr/sbin/zsh", args = ["--login"] }
