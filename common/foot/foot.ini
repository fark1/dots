# ~/.config/foot/foot.ini
# Converted from alacritty.toml

[main]
# Font (foot uses fontconfig syntax: family:size=N)
font=Fairfax Hax:style=Medium:size=9
font-bold=Fairfax Hax:style=Bold:size=9
font-italic=Fairfax Hax:style=Italic:size=9
font-bold-italic=Fairfax Hax:style=Bold:size=9

# Padding — Alacritty's window.padding x=20 y=20
pad=20x20

# Keep window size fixed when zooming instead of resizing it
# (this is the setting for the behavior you asked about earlier)
resize-by-cells=no

# Alacritty's selection.save_to_clipboard = true equivalent
selection-target=clipboard

[scrollback]
# foot defaults to 1000 lines; bump this up if you want more history
lines=10000

[cursor]
style=block

[colors-dark]
foreground=b6beca
background=040405

# text-color then background-color for the cursor, no "#" prefix
cursor=040405 f5f5f5

# Normal colors (colors.normal in alacritty.toml)
regular0=101419
regular1=e05f65
regular2=78dba9
regular3=f1cf8a
regular4=70a5eb
regular5=c68aee
regular6=74bee9
regular7=dee1e6

# Bright colors (colors.bright in alacritty.toml)
bright0=1c252c
bright1=fc7b81
bright2=94f7c5
bright3=ffeba6
bright4=8cc1ff
bright5=e2a6ff
bright6=90daff
bright7=fafdff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
